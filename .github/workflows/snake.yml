name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate light-mode growing snake from top-left
        run: |
          python .github/scripts/generate_snake.py \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-light.svg \
            --theme green
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate dark-mode growing snake from top-left
        run: |
          python .github/scripts/generate_snake.py \
            --user "${{ github.repository_owner }}" \
            --output dist/snake-dark.svg \
            --theme matrix
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish snake animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
